
name: Build SpamShield APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./SpamShield

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Inspect Android project
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          echo "Gradle build files:"
          find . -maxdepth 3 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \) -print

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            echo "Using Gradle wrapper"
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle 8.10.2"
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload SpamShield APK
        uses: actions/upload-artifact@v4
        with:
          name: SpamShield-Debug-APK
          path: SpamShield/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
